name: test-system-dev

services:
  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API (Express + ts-node hot-reload) ────────────────────────────────────
  api:
    build:
      context: ..
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/testdb
      JWT_SECRET: dev-secret-change-in-prod
      PORT: 5000
      NODE_ENV: development
    volumes:
      - ..:/app
      - dev_node_modules:/app/node_modules
      - dev_db_modules:/app/packages/database/node_modules
    ports:
      - "5000:5000"
    working_dir: /app
    # Run prisma migrate on startup so schema is always current, then start the dev server
    command: >
      sh -c "cd packages/database && npx prisma migrate deploy &&
             cd ../.. && npm run dev -w @test-system/api"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Admin Dashboard (Next.js hot-reload) ──────────────────────────────────
  dashboard:
    build:
      context: ..
    environment:
      NEXT_PUBLIC_API_URL: http://api:5000
      NODE_ENV: development
    volumes:
      - ..:/app
      - dev_node_modules:/app/node_modules
      - dev_db_modules:/app/packages/database/node_modules
      - dashboard_next:/app/apps/admin-dashboard/.next
    ports:
      - "3000:3000"
    working_dir: /app
    command: npm run dev -w admin-dashboard
    restart: unless-stopped

  # ── Telegram Bot (ts-node hot-reload) ─────────────────────────────────────
  bot:
    build:
      context: ..
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_URL: http://api:5000
      NODE_ENV: development
    volumes:
      - ..:/app
      - dev_node_modules:/app/node_modules
      - dev_db_modules:/app/packages/database/node_modules
    working_dir: /app
    command: npm run dev -w @test-system/telegram-bot
    depends_on:
      - api
    restart: unless-stopped

  # ── Mini App (Vite dev server) ─────────────────────────────────────────────
  mini-app:
    build:
      context: ..
    environment:
      # VITE_API_URL must point to localhost (resolved by the user's browser, not Docker)
      VITE_API_URL: http://localhost:5000
    volumes:
      - ..:/app
      - dev_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    working_dir: /app
    # --host exposes the Vite dev server on 0.0.0.0 so it's reachable from outside the container
    command: npm run dev -w @test-system/mini-app -- --host
    restart: unless-stopped

volumes:
  postgres_data:
  dev_node_modules:
  dev_db_modules:
  dashboard_next:
